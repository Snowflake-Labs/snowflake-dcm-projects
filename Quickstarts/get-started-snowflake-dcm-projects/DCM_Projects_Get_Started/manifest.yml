manifest_version: 2

type: DCM_PROJECT

#---------------------------------------------

default_target: DCM_DEV

targets:
  DCM_DEV:
    account_identifier: MYORG-MY_DEV_ACCOUNT        # update to your account names
    project_name: DCM_DEMO.PROJECTS.DCM_PROJECT_DEV
    project_owner: DCM_DEVELOPER
    templating_config: DEV
    
  DCM_STAGE:
    account_identifier: MYORG-MY_STAGE_ACCOUNT      # update to your account names
    project_name: DCM_DEMO.PROJECTS.DCM_PROJECT_STG
    project_owner: DCM_STAGE_DEPLOYER
    templating_config: STAGE
    
  DCM_PROD_US:
    account_identifier: MYORG-MY_ACCOUNT_US         # update to your account names
    project_name: DCM_DEMO.PROJECTS.DCM_PROJECT_PROD
    project_owner: DCM_PROD_DEPLOYER
    templating_config: PROD

  DCM_PROD_EU:
    account_identifier: MYORG-MY_ACCOUNT_EU         # update to your account names
    project_name: DCM_DEMO.PROJECTS.DCM_PROJECT_PROD
    project_owner: DCM_PROD_DEPLOYER
    templating_config: PROD

#---------------------------------------------

# Assets are source files the project deploys but does not define in SQL.
# Naming a folder here lets the project reference pre-existing files from
# outside sources/ and import them during the rendering phase, which is what
# DEFINE STREAMLIT and DEFINE CODE BUNDLE pick up as 'asset://orders_dashboard/'. The asset name is yours to choose.
#
# Paths are relative to this file, use only * and ** as wildcards, and must sit
# outside sources/, which is reserved for definitions, macros and tests.
# A pattern that matches no files fails the run.
assets:
  orders_dashboard:
    path: 'streamlit/dashboard/**/*'

#---------------------------------------------

templating:
  defaults:
    wh_size: "X-SMALL"

  # SECRETS STEP 1 of 2: uncomment the four lines below.
  # env_vars and env_secrets declare NAMES only. Their values are supplied on each
  # plan or deploy (Workspaces Environment Variables fields, shell variables, or a
  # .env file), so they never live in this file or in Git. An env_var renders as
  # plain text; an env_secret renders as a reference and is masked in plan and
  # deploy output and in deployment history.
  # env_vars:
  #   - BUILD_NUMBER:
  # env_secrets:
  #   - PARTNER_API_KEY:

  configurations:
    DEV:
      env_suffix: "_DEV"
      project_owner_role: "DCM_DEVELOPER" 
      # CHANGE STEP 2 of 3: uncomment the line below to resize the warehouse.
      # wh_size inherits "X-SMALL" from templating.defaults until you set it here.
      # wh_size: "SMALL"
      teams: 
        - name: "DEV_TEAM_1" 
          data_retention_days: 1
        # CHANGE STEP 3 of 3: uncomment the two lines below to add a second team.
        # The Jinja loop and the macro expand them into a new schema and a new
        # role, so one manifest edit produces several CREATEs in the plan.
        # - name: "DEV_TEAM_2"
        #   data_retention_days: 3
      
    STAGE:
      env_suffix: "_STG"
      project_owner_role: "DCM_STAGE_DEPLOYER" 
      teams: 
        - name: "STAGE_TEAM_1" 
          data_retention_days: 1
        
    PROD:
      env_suffix: ""
      wh_size: "LARGE"
      project_owner_role: "DCM_PROD_DEPLOYER" 
      teams:
        - name: "Marketing"
          data_retention_days: 1
        - name: "Finance"
          data_retention_days: 30
