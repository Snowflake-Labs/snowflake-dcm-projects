definitions:
  # The Spark job, built from the segments asset declared in manifest.yml.
  - resource: code_bundle
    name: DCM_DEMO_2_MARKETING{{env_suffix}}.SEGMENTS.SEGMENTS_JOB
    from:
      type: asset
      asset: segments
    comment: Spark job that writes CUSTOMER_SEGMENTS from the shared raw tables

  # Four tasks in one graph: check the inputs, run the job, then branch on how
  # the run went. REPORT_SEGMENTS runs only when everything succeeded;
  # ON_FAILURE uses advanced branching and runs only when a step failed.
  # The graph deploys suspended; the guide runs it with EXECUTE TASK GRAPH.
  - resource: task_graph_object
    name: DCM_DEMO_2_MARKETING{{env_suffix}}.SEGMENTS.SEGMENTS_PIPELINE
    roots:
      - DCM_DEMO_2_MARKETING{{env_suffix}}.SEGMENTS.CHECK_INPUTS
    schedule:
      type: interval
      value: 24
      unit: hours
    state: suspended
    comment: Builds the Marketing customer segments once a day

  - resource: task
    name: DCM_DEMO_2_MARKETING{{env_suffix}}.SEGMENTS.CHECK_INPUTS
    warehouse: DCM_DEMO_2_MARKETING_WH{{env_suffix}}
    comment: Fails the run early if the raw trades have not arrived
    definition:
      type: sql
      value: |
        BEGIN
            LET trades INTEGER := (SELECT COUNT(*) FROM DCM_DEMO_2{{env_suffix}}.RAW.TRADE_STG);
            IF (trades = 0) THEN
                -- Fail the task, so the graph takes the ON_FAILURE branch.
                LET no_trades EXCEPTION := EXCEPTION (-20001, 'no trades in RAW.TRADE_STG');
                RAISE no_trades;
            END IF;
            LET msg STRING := 'raw trades available: ' || :trades;
            CALL SYSTEM$SET_RETURN_VALUE(:msg);
        END

  - resource: task
    name: DCM_DEMO_2_MARKETING{{env_suffix}}.SEGMENTS.BUILD_SEGMENTS
    warehouse: DCM_DEMO_2_MARKETING_WH{{env_suffix}}
    predecessors:
      - DCM_DEMO_2_MARKETING{{env_suffix}}.SEGMENTS.CHECK_INPUTS
    comment: Runs the Spark job
    definition:
      type: sql
      value: |
        BEGIN
            EXECUTE CODE BUNDLE DCM_DEMO_2_MARKETING{{env_suffix}}.SEGMENTS.SEGMENTS_JOB
                ENTRYPOINT = 'segments.py'
                ARGUMENTS = ('--raw-db', 'DCM_DEMO_2{{env_suffix}}', '--target-db', 'DCM_DEMO_2_MARKETING{{env_suffix}}');
            CALL SYSTEM$SET_RETURN_VALUE('Spark job finished');
        END

  - resource: task
    name: DCM_DEMO_2_MARKETING{{env_suffix}}.SEGMENTS.REPORT_SEGMENTS
    warehouse: DCM_DEMO_2_MARKETING_WH{{env_suffix}}
    predecessors:
      - DCM_DEMO_2_MARKETING{{env_suffix}}.SEGMENTS.BUILD_SEGMENTS
    comment: Summarises the segments the job wrote
    definition:
      type: sql
      value: |
        BEGIN
            LET summary STRING := (
                SELECT LISTAGG(ACTIVITY_TIER || '=' || N, ' ') WITHIN GROUP (ORDER BY ACTIVITY_TIER)
                FROM (SELECT ACTIVITY_TIER, COUNT(*) AS N
                      FROM DCM_DEMO_2_MARKETING{{env_suffix}}.SEGMENTS.CUSTOMER_SEGMENTS
                      GROUP BY ACTIVITY_TIER));
            LET msg STRING := 'segments: ' || :summary;
            CALL SYSTEM$SET_RETURN_VALUE(:msg);
        END

  - resource: task
    name: DCM_DEMO_2_MARKETING{{env_suffix}}.SEGMENTS.ON_FAILURE
    warehouse: DCM_DEMO_2_MARKETING_WH{{env_suffix}}
    predecessors:
      - DCM_DEMO_2_MARKETING{{env_suffix}}.SEGMENTS.BUILD_SEGMENTS
    # Advanced branching: runs when BUILD_SEGMENTS failed, or was skipped
    # because CHECK_INPUTS failed before it.
    condition: SYSTEM$PREDECESSORS_STATE('ALL_DONE') AND SYSTEM$TASK_COMPLETION_STATE('BUILD_SEGMENTS') != 'SUCCEEDED'
    comment: Records which step stopped the run
    definition:
      type: sql
      value: |
        BEGIN
            LET check_state STRING := SYSTEM$TASK_COMPLETION_STATE('CHECK_INPUTS');
            LET build_state STRING := SYSTEM$TASK_COMPLETION_STATE('BUILD_SEGMENTS');
            LET msg STRING := 'segments not rebuilt: CHECK_INPUTS ' || :check_state || ', BUILD_SEGMENTS ' || :build_state;
            CALL SYSTEM$SET_RETURN_VALUE(:msg);
        END
