manifest_version: 2

type: DCM_PROJECT

#---------------------------------------------

default_target: DCM_DEV

targets:
  DCM_DEV:
    account_identifier: MYORG-MY_DEV_ACCOUNT
    project_name: DCM_DEMO.PROJECTS.DCM_GOV_PROJECT_DEV
    project_owner: DCM_DEVELOPER
    templating_config: DEV

  DCM_PROD:
    account_identifier: MYORG-MY_PROD_ACCOUNT       # <-- Replace with your account identifier
    project_name: DCM_DEMO.PROJECTS.DCM_GOV_PROJECT_PROD
    project_owner: DCM_PROD_DEPLOYER
    templating_config: PROD

#---------------------------------------------

templating:
  defaults:
    wh_size: "X-SMALL"

  configurations:
    DEV:
      env_suffix: "_DEV"
      project_owner_role: "DCM_DEVELOPER"

    PROD:
      env_suffix: ""
      wh_size: "SMALL"
      project_owner_role: "DCM_PROD_DEPLOYER"
