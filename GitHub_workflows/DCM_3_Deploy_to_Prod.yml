name: "DCM 3) Deploy to PROD"

on:
  push:
    branches: ["main"]
    paths:
      - 'Quickstarts/**'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  DCM_PROJECT_PATH: Quickstarts/DCM_Project_Quickstart_1/
  SNOWFLAKE_USER: GITHUB_ACTIONS_SERVICE_USER

jobs:
  PROD:
    runs-on: ubuntu-latest
    environment: DCM_PROD_US
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: snowflakedb/snowflake-actions/dcm/plan@v3
        id: plan
        with:
          target: DCM_PROD_US
          project-path: ${{ env.DCM_PROJECT_PATH }}
          snowflake-user: ${{ env.SNOWFLAKE_USER }}
          comment-on-pr: "true"

      - uses: snowflakedb/snowflake-actions/dcm/deploy@v3
        id: deploy
        with:
          target: DCM_PROD_US
          project-path: ${{ env.DCM_PROJECT_PATH }}
          snowflake-user: ${{ env.SNOWFLAKE_USER }}
          allow-drops: "false"
          post-scripts-path: "SQL_post_scripts"
          comment-on-pr: "true"
