name: "DCM 4) Deploy to STAGE & PROD"

on:
  push:
    branches: ["main"]
    paths:
      - 'sample-projects/**'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  DCM_PROJECT_PATH: sample-projects/dcm-full-demo-project/
  SNOWFLAKE_USER: GITHUB_ACTIONS_SERVICE_USER

jobs:
  # ---- STAGE ----
  STAGE:
    runs-on: ubuntu-latest
    environment: DCM_STAGE
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - uses: snowflakedb/snowflake-actions/dcm/plan@v3
        id: plan
        with:
          target: DCM_STAGE
          project-path: ${{ env.DCM_PROJECT_PATH }}
          snowflake-user: ${{ env.SNOWFLAKE_USER }}
          comment-on-pr: "true"

      - uses: snowflakedb/snowflake-actions/dcm/deploy@v3
        id: deploy
        with:
          target: DCM_STAGE
          project-path: ${{ env.DCM_PROJECT_PATH }}
          snowflake-user: ${{ env.SNOWFLAKE_USER }}
          allow-drops: "false"
          post-scripts-path: "SQL_post_scripts"
          comment-on-pr: "true"

  # ---- PROD (only after STAGE succeeds) ----
  PROD:
    needs: STAGE
    runs-on: ubuntu-latest
    environment: DCM_PROD_US
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - uses: snowflakedb/snowflake-actions/dcm/plan@v3
        id: plan
        with:
          target: DCM_PROD_US
          project-path: ${{ env.DCM_PROJECT_PATH }}
          snowflake-user: ${{ env.SNOWFLAKE_USER }}
          comment-on-pr: "true"

      - uses: snowflakedb/snowflake-actions/dcm/deploy@v3
        id: deploy
        with:
          target: DCM_PROD_US
          project-path: ${{ env.DCM_PROJECT_PATH }}
          snowflake-user: ${{ env.SNOWFLAKE_USER }}
          allow-drops: "false"
          post-scripts-path: "SQL_post_scripts"
          comment-on-pr: "true"